; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Shared settings
[common]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.12
	adafruit/Adafruit GFX Library@^1.11.11
	bblanchon/ArduinoJson@^7.3.0
	arduino-libraries/NTPClient@^3.2.1
	knolleary/PubSubClient@^2.8
	h2zero/NimBLE-Arduino@^1.4.1

; Production build v1 (default): pio run
[env:release]
extends = common
build_src_filter = +<*> -<panel_test.cpp> -<ble_test.cpp> -<wifi_test.cpp>
build_flags = -DHW_VERSION='"v1"'

; Production build v2: pio run -e release-v2 (ESP32-S3-WROOM-1 N8R8)
[env:release-v2]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
upload_protocol = esp-builtin
build_src_filter = +<*> -<panel_test.cpp> -<ble_test.cpp> -<wifi_test.cpp>
build_flags =
	-DHW_VERSION='"v2"'
	-DHW_V2
	-DSUPPORTS_ANIMATION
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM

; Debug build v1: pio run -e debug
; Skips OTA checks, extra logging
[env:debug]
extends = common
build_flags = -DDEV_MODE -DHW_VERSION='"v1"'

; Minimal WiFi test for v2 hardware
[env:test-wifi]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_protocol = esptool
upload_flags =
	--no-stub
build_src_filter = -<*> +<wifi_test.cpp>
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM

